    &lt;table class=&quot;cd-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Materiał&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Miejsce&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Stan&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Aktualne CV&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Miejsce&quot;&gt;Plik do dodania&lt;/td&gt;&lt;td data-label=&quot;Stan&quot;&gt;Posiadasz · niezaimportowane&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Portfolio&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Miejsce&quot;&gt;Google Drive&lt;/td&gt;&lt;td data-label=&quot;Stan&quot;&gt;Link/dokumenty do powiązania&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Workflow i automatyzacje&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Miejsce&quot;&gt;n8n&lt;/td&gt;&lt;td data-label=&quot;Stan&quot;&gt;Zakres projektów do odczytania&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Repozytoria&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Miejsce&quot;&gt;GitHub&lt;/td&gt;&lt;td data-label=&quot;Stan&quot;&gt;W rozwoju&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Strona i LinkedIn&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Miejsce&quot;&gt;Odnośniki&lt;/td&gt;&lt;td data-label=&quot;Stan&quot;&gt;Do zapisania w profilu&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;section class=&quot;cd-detail&quot; style=&quot;margin-top:32px&quot;&gt;&lt;h2&gt;Wersja wysłana pozostaje niezmienna&lt;/h2&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Dopasowane CV będzie powiązane z konkretną aplikacją. Aktualizacja profilu nie zmieni dokumentu, który wcześniej wysłałeś.&lt;/p&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Import dokumentu to propozycja faktów do sprawdzenia. Sam odnośnik do Drive nie oznacza odczytania jego zawartości.&lt;/p&gt;&lt;/section&gt;
  &lt;/template&gt;
  &lt;template id=&quot;cd-template-assistant&quot;&gt;
    &lt;div class=&quot;cd-heading&quot;&gt;&lt;div&gt;&lt;h1&gt;CV MASTER AI&lt;/h1&gt;&lt;p&gt;Przygotuj prawdziwą aplikację dla konkretnej firmy.&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;cd-tag&quot;&gt;Model niepołączony&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;cd-notice&quot;&gt;&lt;strong&gt;Podgląd procesu asystenta&lt;/strong&gt;Nie wykonano researchu i nie wygenerowano dokumentów. Możesz przejrzeć projekt każdego kroku. Dane firmy i oferty są demonstracyjne.&lt;/div&gt;
    &lt;p class=&quot;cd-small cd-muted&quot; style=&quot;margin-bottom:16px&quot;&gt;Aplikacja: Specjalista automatyzacji treści · Studio Treści — DEMO&lt;/p&gt;
    &lt;nav class=&quot;cd-steps&quot; aria-label=&quot;Kroki CV MASTER AI&quot;&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-ai-step=&quot;profile&quot; aria-pressed=&quot;true&quot;&gt;Profil&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-ai-step=&quot;research&quot; aria-pressed=&quot;false&quot;&gt;Research&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-ai-step=&quot;match&quot; aria-pressed=&quot;false&quot;&gt;Dopasowanie&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-ai-step=&quot;materials&quot; aria-pressed=&quot;false&quot;&gt;Materiały&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-ai-step=&quot;check&quot; aria-pressed=&quot;false&quot;&gt;Kontrola&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-ai-step=&quot;approval&quot; aria-pressed=&quot;false&quot;&gt;Akceptacja&lt;/button&gt;&lt;/nav&gt;
    &lt;section id=&quot;cd-ai-content&quot;&gt;&lt;/section&gt;
  &lt;/template&gt;
  &lt;template id=&quot;cd-ai-profile&quot;&gt;&lt;div class=&quot;cd-grid2&quot;&gt;&lt;section class=&quot;cd-detail&quot;&gt;&lt;h2&gt;1. Dane do tej aplikacji&lt;/h2&gt;&lt;ul class=&quot;cd-checklist&quot;&gt;&lt;li&gt;Automatyzacja produkcji treści&lt;p class=&quot;cd-muted&quot;&gt;Źródło: Twoja deklaracja w wywiadzie&lt;/p&gt;&lt;/li&gt;&lt;li&gt;Projekty n8n&lt;p class=&quot;cd-muted&quot;&gt;Potrzebne: wybrany projekt i zakres Twojej pracy&lt;/p&gt;&lt;/li&gt;&lt;li&gt;Doświadczenie, edukacja i języki&lt;p class=&quot;cd-muted&quot;&gt;Odczytamy z CV i przedstawimy do sprawdzenia&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section class=&quot;cd-detail&quot;&gt;&lt;h2&gt;Co jest potrzebne&lt;/h2&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Aktualne CV oraz przykład projektu. Brakujących informacji nie zastąpimy domysłami.&lt;/p&gt;&lt;div class=&quot;cd-actions&quot;&gt;&lt;button class=&quot;cd-button cursor-interaction&quot; type=&quot;button&quot; data-screen=&quot;profile&quot;&gt;Otwórz profil&lt;/button&gt;&lt;button class=&quot;cd-button&quot; type=&quot;button&quot; disabled&gt;Rozpocznij analizę&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Analiza wymaga połączenia modelu.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;/template&gt;
  &lt;template id=&quot;cd-ai-research&quot;&gt;&lt;section class=&quot;cd-detail&quot;&gt;&lt;h2&gt;2. Firma i stanowisko&lt;/h2&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Research jeszcze niewykonany. Asystent będzie korzystał z dostępnych źródeł, zaczynając od strony firmy i oferty.&lt;/p&gt;&lt;dl&gt;&lt;dt&gt;Źródło&lt;/dt&gt;&lt;dd&gt;Adres strony lub dokumentu&lt;/dd&gt;&lt;dt&gt;Sprawdzono&lt;/dt&gt;&lt;dd&gt;Data rzeczywistego odczytu&lt;/dd&gt;&lt;dt&gt;Fakty&lt;/dt&gt;&lt;dd&gt;Tylko twierdzenia poparte źródłem&lt;/dd&gt;&lt;dt&gt;Wnioski&lt;/dt&gt;&lt;dd&gt;Oznaczone osobno jako analiza&lt;/dd&gt;&lt;/dl&gt;&lt;/section&gt;&lt;div class=&quot;cd-notice&quot;&gt;&lt;strong&gt;Osoba rekrutująca&lt;/strong&gt;Wyłącznie publiczne informacje zawodowe istotne dla roli. Bez prywatnych danych i zgadywania preferencji.&lt;/div&gt;&lt;/template&gt;
  &lt;template id=&quot;cd-ai-match&quot;&gt;&lt;section class=&quot;cd-detail&quot;&gt;&lt;h2&gt;3. Macierz dopasowania&lt;/h2&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Przykład struktury — analiza AI nie została wykonana.&lt;/p&gt;&lt;table class=&quot;cd-table&quot; style=&quot;margin-top:16px&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Wymaganie&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Dowód&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Luka&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Automatyzacja treści&lt;/td&gt;&lt;td data-label=&quot;Dowód&quot;&gt;Deklaracja profilu&lt;/td&gt;&lt;td data-label=&quot;Luka&quot;&gt;Projekt do powiązania&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Integracje API&lt;/td&gt;&lt;td data-label=&quot;Dowód&quot;&gt;Brak informacji&lt;/td&gt;&lt;td data-label=&quot;Luka&quot;&gt;Nie można ocenić&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/section&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Asystent uzasadni ocenę. Nie pokaże jej jako rzeczywistego wyniku ATS.&lt;/p&gt;&lt;/template&gt;
  &lt;template id=&quot;cd-ai-materials&quot;&gt;&lt;div class=&quot;cd-grid2&quot;&gt;&lt;section class=&quot;cd-detail&quot;&gt;&lt;h2&gt;4. Wybrane dokumenty&lt;/h2&gt;&lt;ul class=&quot;cd-checklist&quot;&gt;&lt;li&gt;CV dopasowane do stanowiska&lt;/li&gt;&lt;li&gt;Wiadomość do rekrutera&lt;/li&gt;&lt;li&gt;List motywacyjny — jeśli potrzebny&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Wybierzesz potrzebne materiały. Każdy dokument zaczyna jako szkic.&lt;/p&gt;&lt;div class=&quot;cd-actions&quot;&gt;&lt;button class=&quot;cd-button&quot; type=&quot;button&quot; disabled&gt;Przygotuj szkic&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;cd-doc-preview&quot;&gt;&lt;span class=&quot;cd-tag&quot;&gt;Układ CV · podgląd&lt;/span&gt;&lt;h2 style=&quot;margin-top:24px&quot;&gt;Julian&lt;/h2&gt;&lt;p&gt;Podsumowanie dopasowane do stanowiska&lt;/p&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Treść zostanie przygotowana z rzeczywistych faktów profilu. Bez wymyślania historii pracy lub wyników.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Doświadczenie&lt;/strong&gt;&lt;/p&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Wpisy z CV po sprawdzeniu&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Umiejętności i projekty&lt;/strong&gt;&lt;/p&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Dowody istotne dla tej oferty&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;/template&gt;
  &lt;template id=&quot;cd-ai-check&quot;&gt;&lt;section class=&quot;cd-detail&quot;&gt;&lt;h2&gt;5. Kontrola jakości&lt;/h2&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Kontrola nie została wykonana. Tak będzie wyglądać lista wyników:&lt;/p&gt;&lt;ul class=&quot;cd-checklist&quot;&gt;&lt;li&gt;Fakty i daty zgodne z profilem — do sprawdzenia&lt;/li&gt;&lt;li&gt;Wymagania poparte dowodami — do sprawdzenia&lt;/li&gt;&lt;li&gt;Brak fikcyjnych kompetencji i liczb — do sprawdzenia&lt;/li&gt;&lt;li&gt;Język, dane kontaktowe i czytelność — do sprawdzenia&lt;/li&gt;&lt;li&gt;Odczytywalność PDF/DOCX — po wygenerowaniu plików&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Raport pokaże uwagi, blokujące braki i źródła twierdzeń. Sama analiza AI nie jest potwierdzeniem wszystkich faktów.&lt;/p&gt;&lt;/template&gt;
  &lt;template id=&quot;cd-ai-approval&quot;&gt;&lt;section class=&quot;cd-detail&quot;&gt;&lt;h2&gt;6. Twoja akceptacja&lt;/h2&gt;&lt;p&gt;Przed zatwierdzeniem zobaczysz wersję CV, odbiorcę wiadomości i listę załączników.&lt;/p&gt;&lt;dl&gt;&lt;dt&gt;CV&lt;/dt&gt;&lt;dd&gt;Nie wygenerowano — brak wersji do zatwierdzenia&lt;/dd&gt;&lt;dt&gt;Wiadomość&lt;/dt&gt;&lt;dd&gt;Nie wygenerowano&lt;/dd&gt;&lt;dt&gt;Wysyłka&lt;/dt&gt;&lt;dd&gt;Niepołączona&lt;/dd&gt;&lt;/dl&gt;&lt;div class=&quot;cd-actions&quot;&gt;&lt;button class=&quot;cd-button&quot; type=&quot;button&quot; disabled&gt;Zatwierdź dokumenty&lt;/button&gt;&lt;button class=&quot;cd-button&quot; type=&quot;button&quot; disabled&gt;Wyślij — brak integracji&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;cd-small cd-muted&quot;&gt;Zmiana treści, odbiorcy lub załączników wymaga ponownego potwierdzenia. Status aplikacji nie zmienia się przez samo wygenerowanie CV.&lt;/p&gt;&lt;/section&gt;&lt;/template&gt;
  &lt;template id=&quot;cd-template-settings&quot;&gt;
    &lt;div class=&quot;cd-heading&quot;&gt;&lt;div&gt;&lt;h1&gt;Ustawienia&lt;/h1&gt;&lt;p&gt;Konfiguracja, dostęp i bezpieczeństwo.&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;cd-tag&quot;&gt;Wersja lokalna&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;cd-grid2&quot;&gt;&lt;section class=&quot;cd-detail&quot;&gt;&lt;h2&gt;Integracje&lt;/h2&gt;&lt;ul class=&quot;cd-checklist&quot;&gt;&lt;li&gt;AOL&lt;p class=&quot;cd-muted&quot;&gt;Niepołączone · planowany import wybranych alertów&lt;/p&gt;&lt;/li&gt;&lt;li&gt;Model AI&lt;p class=&quot;cd-muted&quot;&gt;Niepołączone · lokalny model do sprawdzenia&lt;/p&gt;&lt;/li&gt;&lt;li&gt;Google Drive i GitHub&lt;p class=&quot;cd-muted&quot;&gt;Niepołączone · na początek pliki i odnośniki&lt;/p&gt;&lt;/li&gt;&lt;li&gt;Portale i LinkedIn&lt;p class=&quot;cd-muted&quot;&gt;Zapisane wyszukiwania i alerty do konfiguracji&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section class=&quot;cd-detail&quot;&gt;&lt;h2&gt;Dane i kopie zapasowe&lt;/h2&gt;&lt;dl&gt;&lt;dt&gt;Magazyn&lt;/dt&gt;&lt;dd&gt;Planowana lokalna baza&lt;/dd&gt;&lt;dt&gt;Ostatnia kopia&lt;/dt&gt;&lt;dd&gt;Brak — aplikacja nie jest jeszcze zbudowana&lt;/dd&gt;&lt;dt&gt;Eksport&lt;/dt&gt;&lt;dd&gt;CSV dla list; JSON i pliki dla pełnych danych&lt;/dd&gt;&lt;dt&gt;Odzyskiwanie&lt;/dt&gt;&lt;dd&gt;Podgląd i potwierdzenie przed przywróceniem&lt;/dd&gt;&lt;/dl&gt;&lt;div class=&quot;cd-actions&quot;&gt;&lt;button class=&quot;cd-button&quot; type=&quot;button&quot; disabled&gt;Utwórz kopię&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
    &lt;div class=&quot;cd-notice&quot;&gt;&lt;strong&gt;Budżet: 0 zł miesięcznie&lt;/strong&gt;Płatne usługi pozostają wyłączone. Model, narzędzia i źródła muszą być rzeczywiście skonfigurowane. Hasła i klucze nie będą trafiały do frontendu ani eksportów.&lt;/div&gt;
  &lt;/template&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;career-design&#x27;);
      const main = root.querySelector(&#x27;#cd-main&#x27;);
      const selector = root.querySelector(&#x27;#cd-state-select&#x27;);
      const shell = root.querySelector(&#x27;.cd-shell&#x27;);
      const dialog = root.querySelector(&#x27;#cd-add-dialog&#x27;);
      const names = { today:&#x27;Dzisiaj&#x27;, offers:&#x27;Oferty&#x27;, applications:&#x27;Aplikacje&#x27;, detail:&#x27;Aplikacja&#x27;, plan:&#x27;Plan&#x27;, profile:&#x27;Mój profil&#x27;, materials:&#x27;Materiały&#x27;, assistant:&#x27;CV MASTER AI&#x27;, settings:&#x27;Ustawienia&#x27; };
      const state = { screen:&#x27;today&#x27;, view:&#x27;sample&#x27;, detailTab:&#x27;overview&#x27;, aiStep:&#x27;profile&#x27;, compact:false };
      const saved = window.openai?.widgetState?.modelContent;
      if (saved &amp;&amp; names[saved.screen]) state.screen = saved.screen;
      if (saved &amp;&amp; [&#x27;sample&#x27;,&#x27;empty&#x27;,&#x27;loading&#x27;,&#x27;error&#x27;,&#x27;offline&#x27;].includes(saved.view)) state.view = saved.view;
      if (saved &amp;&amp; [&#x27;overview&#x27;,&#x27;match&#x27;,&#x27;documents&#x27;,&#x27;history&#x27;].includes(saved.detailTab)) state.detailTab=saved.detailTab;
      if (saved &amp;&amp; [&#x27;profile&#x27;,&#x27;research&#x27;,&#x27;match&#x27;,&#x27;materials&#x27;,&#x27;check&#x27;,&#x27;approval&#x27;].includes(saved.aiStep)) state.aiStep=saved.aiStep;
      if (typeof window.openai?.widgetState?.privateContent?.compact===&#x27;boolean&#x27;) state.compact=window.openai.widgetState.privateContent.compact;
      root.style.setProperty(&#x27;--career-row&#x27;,state.compact?&#x27;12px&#x27;:&#x27;20px&#x27;);
      const clone = id =&gt; root.querySelector(&#x27;#&#x27;+id).content.cloneNode(true);
      const icons = () =&gt; { if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width:16, height:16 } }); };
      const persist = () =&gt; { window.openai?.setWidgetState?.({ modelContent:{screen:state.screen,view:state.view,detailTab:state.detailTab,aiStep:state.aiStep}, privateContent:{compact:state.compact} })?.catch(()=&gt;{}); };
      function renderDetail() {
        const content = root.querySelector(&#x27;#cd-detail-content&#x27;);
        if (!content) return;
        content.replaceChildren(clone(&#x27;cd-detail-&#x27;+state.detailTab));
        main.querySelectorAll(&#x27;[data-detail-tab]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.detailTab===state.detailTab)));
      }
      function renderAI() {
        const content = root.querySelector(&#x27;#cd-ai-content&#x27;);
        if (!content) return;
        content.replaceChildren(clone(&#x27;cd-ai-&#x27;+state.aiStep));
        main.querySelectorAll(&#x27;[data-ai-step]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.aiStep===state.aiStep)));
      }
      function render() {
        main.replaceChildren(clone(&#x27;cd-template-&#x27;+state.screen));
        if (state.screen===&#x27;detail&#x27;) renderDetail();
        if (state.screen===&#x27;assistant&#x27;) renderAI();
        if (state.view!==&#x27;sample&#x27;) {
          main.replaceChildren();
          const heading=document.createElement(&#x27;div&#x27;); heading.className=&#x27;cd-heading&#x27;;
          const title=document.createElement(&#x27;h1&#x27;); title.textContent=names[state.screen]; heading.append(title); main.append(heading);
          const body=document.createElement(&#x27;section&#x27;); body.className=&#x27;cd-state&#x27;;
          if (state.view===&#x27;empty&#x27;) body.innerHTML=&#x27;&lt;div class=&quot;cd-state-mark&quot; aria-hidden=&quot;true&quot;&gt;+&lt;/div&gt;&lt;h2&gt;Zacznij od pierwszej oferty.&lt;/h2&gt;&lt;p&gt;Dodaj link i treść ogłoszenia. Z tego miejsca utworzysz aplikację i zaplanujesz kolejne działanie.&lt;/p&gt;&lt;button class=&quot;cd-button cd-primary cursor-interaction&quot; type=&quot;button&quot; data-open-add&gt;Dodaj pierwszą ofertę&lt;/button&gt;&#x27;;
          if(state.view===&#x27;empty&#x27; &amp;&amp; state.screen===&#x27;profile&#x27;) body.innerHTML=&#x27;&lt;div class=&quot;cd-state-mark&quot; aria-hidden=&quot;true&quot;&gt;+&lt;/div&gt;&lt;h2&gt;Zacznij od swojego CV.&lt;/h2&gt;&lt;p&gt;Zaimportuj dokument, sprawdź wyodrębnione informacje i zbuduj wspólny profil zawodowy.&lt;/p&gt;&lt;button class=&quot;cd-button&quot; type=&quot;button&quot; disabled&gt;Importuj CV — podgląd&lt;/button&gt;&#x27;;
          if(state.view===&#x27;empty&#x27; &amp;&amp; state.screen===&#x27;materials&#x27;) body.innerHTML=&#x27;&lt;div class=&quot;cd-state-mark&quot; aria-hidden=&quot;true&quot;&gt;+&lt;/div&gt;&lt;h2&gt;Zbierz materiały do aplikowania.&lt;/h2&gt;&lt;p&gt;Dodaj CV, odnośnik do portfolio lub wybrany projekt. Powiążesz je z profilem i aplikacjami.&lt;/p&gt;&lt;button class=&quot;cd-button&quot; type=&quot;button&quot; disabled&gt;Dodaj plik lub odnośnik — podgląd&lt;/button&gt;&#x27;;
          if(state.view===&#x27;empty&#x27; &amp;&amp; state.screen===&#x27;applications&#x27;) body.innerHTML=&#x27;&lt;div class=&quot;cd-state-mark&quot; aria-hidden=&quot;true&quot;&gt;+&lt;/div&gt;&lt;h2&gt;Tu pojawią się Twoje aplikacje.&lt;/h2&gt;&lt;p&gt;Wybierz zapisaną ofertę, aby przygotować pierwsze zgłoszenie i śledzić jego postęp.&lt;/p&gt;&lt;button class=&quot;cd-button cd-primary cursor-interaction&quot; type=&quot;button&quot; data-screen=&quot;offers&quot;&gt;Przejrzyj oferty&lt;/button&gt;&#x27;;
